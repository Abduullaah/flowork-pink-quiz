<style>*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<title>flowork Pink Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Jost:wght@400;500&display=swap">
<style>
/* Layout: one centred column, one screen at a time (start, question, result), tuned for iPad portrait */
:root{
  --rose-deep:#7A2244; --rose:#A9406A; --blush:#FFB6CE; --petal:#FFE3EC; --white:#FFFFFF;
  --line:rgba(255,255,255,.28); --glass:rgba(255,255,255,.10);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Jost","Avenir Next","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--rose-deep);
  background:radial-gradient(120% 80% at 50% 0%,var(--rose) 0%,var(--rose-deep) 70%);
  color:var(--white);font-family:var(--body);font-size:18px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.app{min-height:100%;max-width:640px;margin:0 auto;padding-inline:clamp(16px,6vw,48px);display:grid;position:relative}
.screen{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;gap:clamp(20px,4vh,40px);padding-block:5vh;
  transition:opacity .5s ease,transform .5s ease}
.screen.off{opacity:0;transform:translateY(12px);pointer-events:none}
.logo{width:min(78%,420px);height:auto;align-self:center}
.ribbon{width:28px;height:auto;align-self:center;opacity:.9}
.eyebrow{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--petal);text-align:center;margin:0}
h1,h2{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;text-align:center}
h1{font-size:clamp(30px,6vw,52px);line-height:1.15}
h2{font-size:clamp(26px,5.2vw,42px);line-height:1.22}
.lede{font-size:20px;text-align:center;color:var(--petal);line-height:1.55;margin:0 auto;max-width:30em}
.btn{font:500 19px/1 var(--body);letter-spacing:.06em;color:var(--rose-deep);background:var(--white);border:0;border-radius:999px;
  padding:22px 56px;align-self:center;cursor:pointer;transition:transform .2s ease,background .2s ease}
.btn:active{transform:scale(.97);background:var(--petal)}
.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--blush);outline-offset:4px}

/* question screen */
.top{display:flex;align-items:center;gap:16px}
.count{font-variant-numeric:tabular-nums;font-size:15px;letter-spacing:.14em;color:var(--petal);white-space:nowrap}
.bar{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blush);transition:width .6s ease}
.qwrap{display:flex;flex-direction:column;gap:clamp(22px,4vh,36px);transition:opacity .35s ease,transform .35s ease}
.qwrap.fade{opacity:0;transform:translateY(8px)}
.opts{display:grid;gap:14px}
.opt{font:400 22px/1.35 var(--body);color:var(--white);text-align:left;background:var(--glass);border:1px solid var(--line);
  border-radius:18px;padding:22px 24px;display:flex;gap:18px;align-items:center;cursor:pointer;
  transition:background .25s ease,color .25s ease,border-color .25s ease}
.opt b{font:500 14px/1 var(--body);letter-spacing:.1em;width:34px;height:34px;flex:none;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:50%;color:var(--petal);transition:inherit}
.opt.pick{background:var(--white);color:var(--rose-deep);border-color:var(--white)}
.opt.pick b{border-color:var(--rose);color:var(--rose)}

/* result */
.score{font-family:var(--display);font-size:clamp(84px,18vw,140px);line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.score small{font-size:.35em;color:var(--petal)}
.foot{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--petal);opacity:.7}
@media (max-width:520px){body{font-size:16px}.screen{padding-block:28px 56px;gap:20px;justify-content:flex-start;padding-top:max(28px,6vh)}.opt{font-size:17px;padding:15px 16px;gap:14px;border-radius:14px}.opt b{width:28px;height:28px;font-size:12px}.opts{gap:10px}.lede{font-size:17px}.btn{padding:18px 44px;font-size:17px}.foot{position:static;padding-bottom:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ================= EDIT HERE =================
   PASS_MARK: correct answers needed to win (placeholder until confirmed).

const PASS_MARK = 12;
const QUESTIONS = [
  {q:"How many private offices are there at flowork Vision Tower?", a:["40","60","85","120"], c:1},
  {q:"How many private offices are there at flowork Dubai Hills?", a:["30","45","70","95"], c:2},
  {q:"Who is the CEO of flowork?", a:["Amir","Kabir","Abir","Bashir"], c:2},
  {q:"What does a flowork virtual office include?", a:["A business address and mail handling","A dedicated desk every day","Free parking only","Unlimited podcast studio time"], c:0},
  {q:"Which of these does flowork NOT offer?", a:["Boardrooms","Podcast rooms","Co-working desks","A swimming pool"], c:3},
  {q:"Roughly how many people work at flowork?", a:["Under 25","25 to 50","50 to 100","Over 100"], c:0},
  {q:"In which year did flowork open its first space?", a:["2017","2019","2021","2023"], c:3},
  {q:"How many flowork locations are there in Dubai?", a:["2","3","4","5"], c:0},
  {q:"What is a co-working (hot) desk?", a:["A desk reserved for one member only","Any free desk in the shared area, used flexibly","A private office for one person","A desk in the boardroom"], c:1},
  {q:"How many people can the largest flowork boardroom seat?", a:["8","10","15","20"], c:3},
  {q:"How can you book a flowork meeting room?", a:["Only for a full month","By the hour","Only for a full day","Meeting rooms can't be booked"], c:1},
  {q:"Which area is flowork Vision Tower in?", a:["Dubai Marina","DIFC","Business Bay","Jumeirah"], c:2},
  {q:"What can you record in a flowork podcast room?", a:["Audio only","Video only","Audio and video","Nothing, it is a quiet room"], c:2},
  {q:"Which perk comes with every flowork membership?", a:["Free flights","High-speed Wi-Fi and coffee","A company car","A personal chef"], c:1},
  {q:"October is Breast Cancer Awareness Month. What colour is the awareness ribbon?", a:["Blue","Purple","Pink","Yellow"], c:2}
];
/* ============================================= */

const $ = id => document.getElementById(id);
const N = QUESTIONS.length, pad = n => String(n).padStart(2,"0");
let i = 0, right = 0, busy = false, idle;

function show(id){ ["start","quiz","end"].forEach(s => $(s).classList.toggle("off", s !== id)); }

function render(){
  const Q = QUESTIONS[i];
  $("count").textContent = pad(i+1) + " / " + pad(N);
  $("bar").style.width = (i / N * 100) + "%";
  $("q").textContent = Q.q;
  $("opts").innerHTML = "";
  Q.a.forEach((t, k) => {
    const b = document.createElement("button");
    b.className = "opt"; b.id = "opt" + k;
    b.innerHTML = "<b>" + "ABCD"[k] + "</b><span></span>";
    b.querySelector("span").textContent = t;
    b.onclick = () => pick(k, b);
    $("opts").appendChild(b);
  });
}

function pick(k, b){
  if (busy) return; busy = true;
  b.classList.add("pick");
  if (k === QUESTIONS[i].c) right++;
  setTimeout(() => {
    window.scrollTo(0,0);
    $("qwrap").classList.add("fade");
    setTimeout(() => {
      i++;
      if (i < N){ render(); $("qwrap").classList.remove("fade"); busy = false; }
      else finish();
    }, 350);
  }, 380);
}

function finish(){
  $("bar").style.width = "100%";
  const win = right >= PASS_MARK;
  $("score").innerHTML = right + "<small> / " + N + "</small>";
  $("verdict").textContent = win ? "You win!" : "Thank you for playing";
  $("note").textContent = win
    ? "Show this screen to a flowork team member to collect your prize."
    : "You needed " + PASS_MARK + " correct answers to win. Thank you for joining us in pink.";
  show("end");
}

function start(){
  i = 0; right = 0; busy = false;
  render(); $("qwrap").classList.remove("fade");
  show("quiz");
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); } catch(e){}
}
function reset(){ clearTimeout(idle); show("start"); }

$("go").onclick = start;
document.addEventListener("gesturestart", e => e.preventDefault());
</script>
